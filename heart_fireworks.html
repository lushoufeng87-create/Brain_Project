<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Heart Fireworks</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #02020a;
      color: white;
      font-family: Inter, Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .hint {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(8px);
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.8;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hint">Click or tap to launch more sparks</div>
  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let dpr = 1;
    const PARTICLE_COUNT = 17000;
    const CYCLE_DURATION = 16.8;
    const particles = [];
    const heartTargets = [];
    const root = { x: 0, y: 0 };
    const burst = { x: 0, y: 0 };
    const rocket = { x: 0, y: 0, trail: [] };
    let lastTimestamp = 0;
    let currentCycle = -1;
    const sparkCanvas = createSparkCanvas();

    const PHASES = {
      launch: 0.14,
      explode: 0.08,
      converge: 0.30,
      hold: 0.18,
      fade: 0.30
    };

    const phaseEnds = {
      launch: PHASES.launch,
      explode: PHASES.launch + PHASES.explode,
      converge: PHASES.launch + PHASES.explode + PHASES.converge,
      hold: PHASES.launch + PHASES.explode + PHASES.converge + PHASES.hold,
      fade: 1.0
    };

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      root.x = width * 0.5;
      root.y = height * 0.44;
      burst.x = root.x;
      burst.y = root.y + Math.min(width, height) * 0.18;
      buildHeartTargets();
      buildParticles();
    }

    window.addEventListener('resize', resize);
    resize();

    function heartFormula(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x, y };
    }

    function buildHeartTargets() {
      heartTargets.length = 0;
      const edgeCount = 1300;
      const fillCount = 4600;
      const scale = Math.min(width, height) * 0.017;

      for (let i = 0; i < edgeCount; i++) {
        const t = (i / edgeCount) * Math.PI * 2;
        const point = heartFormula(t);
        const radius = 0.96 + Math.random() * 0.06;
        heartTargets.push({ x: point.x * radius * scale, y: -point.y * radius * scale });
      }

      for (let i = 0; i < fillCount; i++) {
        const t = Math.random() * Math.PI * 2;
        const point = heartFormula(t);
        const radius = Math.pow(Math.random(), 0.72) * 0.72 + 0.08;
        const jitter = (Math.random() - 0.5) * 0.08;
        heartTargets.push({ x: point.x * (radius + jitter) * scale, y: -point.y * (radius + jitter) * scale });
      }
    }

    function buildParticles() {
      particles.length = 0;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const target = heartTargets[i % heartTargets.length];
        const angle = Math.random() * Math.PI * 2;
        const speed = 3.2 + Math.random() * 4.5;
        const size = 0.8 + Math.random() * 1.4;
        const brightness = 0.36 + Math.random() * 0.46;
        particles.push({
          targetX: target.x,
          targetY: target.y,
          x: burst.x,
          y: burst.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed * 0.86,
          drag: 0.88 + Math.random() * 0.08,
          attraction: 0.00044 + Math.random() * 0.00018,
          size,
          brightness,
          alpha: 0,
          delay: Math.random() * 0.06,
          flicker: Math.random() * Math.PI * 2,
          noise: Math.random() * 0.8
        });
      }
    }

    function resetParticles() {
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const angle = Math.random() * Math.PI * 2;
        const speed = 3.2 + Math.random() * 4.5;
        p.x = burst.x;
        p.y = burst.y;
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed * 0.86;
        p.alpha = 0;
        p.delay = Math.random() * 0.06;
        p.flicker = Math.random() * Math.PI * 2;
        p.noise = Math.random() * 0.8;
      }
      rocket.trail.length = 0;
    }

    function createSparkCanvas() {
      const size = 24;
      const buf = document.createElement('canvas');
      buf.width = size;
      buf.height = size;
      const g = buf.getContext('2d');
      const grad = g.createRadialGradient(size * 0.5, size * 0.5, 0, size * 0.5, size * 0.5, size * 0.5);
      grad.addColorStop(0, 'rgba(255,255,255,0.96)');
      grad.addColorStop(0.1, 'rgba(255,220,250,0.86)');
      grad.addColorStop(0.22, 'rgba(255,170,235,0.56)');
      grad.addColorStop(0.4, 'rgba(255,110,205,0.18)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      return buf;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeOutExpo(t) {
      return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }

    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function drawBackground(time) {
      const bg = ctx.createLinearGradient(0, 0, 0, height);
      bg.addColorStop(0, '#030108');
      bg.addColorStop(0.5, '#020005');
      bg.addColorStop(1, '#000003');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);

      const starCount = 90;
      for (let i = 0; i < starCount; i++) {
        const x = (i * 87 + time * 7.5) % width;
        const y = (i * 59 + time * 5.8) % height;
        const alpha = 0.02 + 0.04 * Math.sin(time * 0.0012 + i);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, 0.35 + (i % 3) * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawRocket(progress) {
      const startY = height + 24;
      const endY = burst.y - 2;
      rocket.x = root.x;
      rocket.y = startY + (endY - startY) * easeOutCubic(progress);
      rocket.trail.unshift({ x: rocket.x, y: rocket.y + 10, alpha: 0.16 });
      if (rocket.trail.length > 22) rocket.trail.pop();

      ctx.globalCompositeOperation = 'lighter';
      rocket.trail.forEach((point, idx) => {
        ctx.fillStyle = `rgba(255,180,235,${point.alpha * (1 - idx / rocket.trail.length)})`;
        ctx.beginPath();
        ctx.arc(point.x, point.y, 1.1 + idx * 0.04, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = 'rgba(255,250,255,0.96)';
      ctx.beginPath();
      ctx.arc(rocket.x, rocket.y, 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,150,235,0.32)';
      ctx.beginPath();
      ctx.arc(rocket.x, rocket.y, 6.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    function drawBurstRing(phase) {
      const local = (phase - phaseEnds.launch) / PHASES.explode;
      const radius = 8 + local * 54;
      const alpha = Math.max(0, 0.28 * (1 - local));
      if (alpha <= 0) return;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,170,230,${alpha})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(burst.x, burst.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    function render(timestamp) {
      const time = timestamp * 0.001;
      const cycle = ((time / CYCLE_DURATION) % 1 + 1) % 1;
      const cycleId = Math.floor(time / CYCLE_DURATION);
      if (cycleId !== currentCycle) {
        currentCycle = cycleId;
        resetParticles();
      }

      drawBackground(time);

      if (cycle < phaseEnds.launch) {
        drawRocket(cycle / phaseEnds.launch);
      } else if (cycle < phaseEnds.explode) {
        drawRocket(1);
        drawBurstRing(cycle);
      } else {
        drawRocket(1);
      }

      const dt = Math.min((timestamp - lastTimestamp) * 0.001, 0.038);
      lastTimestamp = timestamp;

      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const phase = ((cycle + p.delay) % 1 + 1) % 1;
        if (phase < phaseEnds.launch) {
          p.x = burst.x;
          p.y = burst.y;
          continue;
        }

        const worldTargetX = root.x + p.targetX;
        const worldTargetY = root.y + p.targetY;
        const toTargetX = worldTargetX - p.x;
        const toTargetY = worldTargetY - p.y;
        const distance = Math.hypot(toTargetX, toTargetY);

        const attractionPhase = Math.max(0, Math.min(1, (phase - phaseEnds.explode) / (phaseEnds.converge - phaseEnds.explode)));
        const force = attractionPhase * p.attraction;
        p.vx += toTargetX * force * dt * 60;
        p.vy += toTargetY * force * dt * 60;
        p.vx += (Math.random() - 0.5) * 0.006 * (1 - attractionPhase);
        p.vy += (Math.random() - 0.5) * 0.006 * (1 - attractionPhase);
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;

        const settle = Math.exp(-distance * 0.04);
        const pulse = 0.74 + 0.16 * Math.sin(time * 16 + p.flicker);
        const life = 1 - Math.min(phase, phaseEnds.fade);
        const alpha = Math.max(0, (0.22 + attractionPhase * 0.4) * p.brightness * pulse * life);
        const radius = Math.max(0.9, p.size * (0.92 + settle * 0.28));

        ctx.globalAlpha = Math.min(0.68, alpha);
        ctx.drawImage(sparkCanvas, p.x - radius * 0.5, p.y - radius * 0.5, radius, radius);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      requestAnimationFrame(render);
    }

    canvas.addEventListener('pointerdown', resetParticles);
    requestAnimationFrame(render);
  </script>
</body>
</html>
